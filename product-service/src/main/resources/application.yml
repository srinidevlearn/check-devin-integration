server:
  port: 8082

spring:
  application:
    name: product-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/microservices_db}
  cloud:
    stream:
      binders:
        solace:
          type: solace
          environment:
            solace:
              java:
                host: ${SOLACE_HOST:tcp://localhost:55555}
                msgVpn: ${SOLACE_VPN:default}
                clientUsername: ${SOLACE_USERNAME:default}
                clientPassword: ${SOLACE_PASSWORD:}
      bindings:
        productEvents-out-0:
          destination: product/events
          binder: solace
        productEventListener-in-0:
          destination: product/events
          binder: solace
          group: product-service-group

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
